<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src https://script.google.com https://script.googleusercontent.com https://www.googleapis.com https://openlibrary.org; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1e5e4e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Books">
<title>Book Catalog</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>Book Catalog</h1>
      <div class="brand-right">
        <span class="tally" id="tally"></span>
        <button class="iconbtn" id="settingsBtn" aria-label="Settings" title="Settings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </div>
    </div>
    <div class="searchrow">
      <label class="search" for="q">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Title, author, series, ISBN…" autocomplete="off">
      </label>
      <button class="btn primary" id="addBtn" hidden>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add book
      </button>
    </div>
    <div class="filters">
      <div class="chips" id="statusChips" role="group" aria-label="Status"></div>
      <span class="spacer"></span>
      <div class="selects">
        <select class="sel" id="fGenre" aria-label="Genre"><option value="">All genres</option></select>
        <select class="sel" id="fLang" aria-label="Language"><option value="">All languages</option></select>
        <select class="sel" id="fSort" aria-label="Sort">
          <option value="id-desc">Newest first</option>
          <option value="id-asc">Catalogue no.</option>
          <option value="title">Title A–Z</option>
          <option value="author">Author A–Z</option>
          <option value="rating">Rating</option>
          <option value="series">Series</option>
        </select>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <div id="list" class="list" aria-live="polite"></div>
    <div class="more" id="moreWrap" hidden><button class="btn" id="moreBtn">Show more</button></div>
  </div>
</main>

<div id="layer"></div>
<script src="app.js"></script>
</body>
</html>
