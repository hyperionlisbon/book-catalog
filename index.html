<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' blob: data:; media-src 'self' blob:; connect-src https://script.google.com https://script.googleusercontent.com https://www.googleapis.com https://openlibrary.org; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#DCE3DC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Books">
<title>Book Catalog</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&amp;family=Libre+Franklin:wght@400;500;600&amp;display=swap" referrerpolicy="no-referrer">
<link rel="stylesheet" href="styles.css?v=9">
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <div>
        <div class="eyebrow">My shelves</div>
        <h1>Book Catalog</h1>
      </div>
      <div class="headbtns">
      <button class="roundbtn" id="statsBtn" aria-label="Stats" hidden>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>
      </button>
      <button class="roundbtn" id="settingsBtn" aria-label="Settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>
      </button>
      </div>
    </div>
    <div class="stats" id="tally"></div>
    <div class="searchrow">
    <label class="search" for="q">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search title, author, series…" autocomplete="off">
    </label>
    <button class="roundbtn scanbtn" id="checkBtn" aria-label="Do I own this? Scan a barcode" hidden>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 7V4h3M21 7V4h-3M3 17v3h3M21 17v3h-3M7 8v8M10 8v8M13 8v8M17 8v8"/></svg>
    </button>
    </div>
    <div class="chips" id="statusChips" role="group" aria-label="Status"></div>
    <div class="selects">
      <select class="sel" id="fGenre" aria-label="Genre"><option value="">All genres</option></select>
      <select class="sel" id="fLang" aria-label="Language"><option value="">All languages</option></select>
      <select class="sel" id="fSort" aria-label="Sort">
        <option value="id-desc">Newest first</option>
        <option value="id-asc">Catalogue no.</option>
        <option value="title">Title A–Z</option>
        <option value="author">Author A–Z</option>
        <option value="rating">Rating</option>
        <option value="series">Series</option>
      </select>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <div id="list" aria-live="polite"></div>
    <div class="more" id="moreWrap" hidden><button class="btn" id="moreBtn">Show more</button></div>
  </div>
</main>

<button class="fab" id="addBtn" hidden>
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Add book
</button>

<div id="layer"></div>
<script src="stats-core.js?v=9"></script>
<script src="app.js?v=9"></script>
</body>
</html>
